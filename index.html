<script>
'use strict';
/* =========================================================================
   306ms  —  조건 색만 탭한다.  높이 탭할수록 배율이 크다.
   단일 파일 / 빌드 없음 / 외부 라이브러리·에셋 없음 / Canvas 2D + Web Audio
   ========================================================================= */

/* ---------- 논리 좌표 ---------- */
const W = 360, H = 640;
const FRAME = 1000 / 60;          // 시뮬레이션 1틱 = 60fps 기준 1프레임
const SPAWN_Y = 20;               // 생성 y — HUD 바로 뒤. 곧장 튀어나온다
const FLOOR   = 600;              // 바닥 y
const R       = 24;               // 도형 반지름
const HUD_H   = 44;               // HUD 바 높이
const ACTIVE_MIN = 52;            // HUD 아래로 나온 순간 = 판정 시계 시작 (32px, 약 60ms)
const LANE_X0 = 58, LANE_X1 = 302, LANE_CX = 180;
/* 도형은 언제나 화면에 하나뿐이고 늘 맨 위에서 시작한다.
   그래서 y 는 곧 "네가 얼마나 오래 망설였나"다.
   판정 구간(ACTIVE_MIN~FLOOR = 548px)을 위에서부터 20/20/20/40 으로 나눈다.
   ×1 만 넓은 것은 "늦게라도 맞히면 살긴 산다"를 넓게 두기 위해서다. */
const Z4 = 162, Z3 = 272, Z2 = 382;   // ×4 / ×3 / ×2 / 그 외 ×1
/* 기준은 **매 도형마다** 바뀐다. 전환을 알리는 정지도, 배너도 없다 —
   HUD 가 언제나 「지금 ▸ 다음」을 함께 보여주기 때문이다.
   덕분에 전환 비용이 0 이 되어, 매번 바꿔도 죽은 시간이 늘지 않는다.
   (요청서 2.4 의 1.2초 공백 + 배너는 "도형이 여럿 남은 채 전환하면 애매해진다"를
    막으려던 장치였고, 도형이 하나뿐인 지금은 막을 것이 없다. README 7장) */
const COND_ROLL = 190;            // HUD 에서 「다음」이 「지금」자리로 미끄러지는 시간(ms)

/* 판정 구간 안에서의 진행도 0(맨 위) ~ 1(바닥). 곧 "얼마나 망설였나"의 비율이다. */
function prog(y){
  return Math.max(0, Math.min(1, (y - ACTIVE_MIN) / (FLOOR - ACTIVE_MIN)));
}

/* 채점: **1~30 점 연속**. 칸 단위가 아니다.
   칸 경계는 점수 절벽이었고, 사람들이 몰리는 지점(≈306ms)이 하필 그 경계라
   반응 떨림(±45ms)이 같은 실력을 30점과 20점으로 갈랐다 — 원칙 1 위반이다.
   연속으로 두면 1ms 가 전부 점수에 반영되고, 한 도형 단위 판별력이 17% 오른다.
   (README 8.5장에 측정)

   기본 `curve` 는 지수 1.4 로 아주 살짝 휘어 있다. 두 가지 이유가 있다:
     1) 아래쪽 40% 가 거의 평평해서 **"이미 늦었으면 쉬어가는" 구간**이 남는다.
        완전한 직선(`linear`)은 끝까지 1ms 를 다투게 해서 피로하다.
     2) 직선이면 safe/perfect 점수비가 40% 라 완료 기준 4(40% 이하)에 걸린다.
   ?score=tier|linear 로 되돌려 비교할 수 있다. */
const SCORING = {
  curve:  y => Math.max(1, Math.round(30 * Math.pow(1 - prog(y), 1.4))),  // 30 / 22 / 15 / 8
  linear: y => Math.max(1, Math.round(30 * (1 - prog(y)))),               // 30 / 24 / 18 / 12
  tier:   y => 10 * zoneMult(y),                                          // 40 / 30 / 20 / 10
};
let SCORE_MODE = 'curve';
const WRONG_FREEZE  = 250;        // WRONG 정지(ms)
const MISS_FREEZE   = 380;        // 마지막 목숨을 MISS 로 잃었을 때만 잠깐 멈춤
const LIVES = 3;                  // 요청서 그대로. 한 판 길이는 README 4장 참고
const RESTART_LOCK = 600;         // 게임 오버 후 재시작 탭을 받기까지(ms)

/* ---------- 난이도: 이 표 하나만 고친다 ----------
   speed : px/frame(60fps 기준). 판정 칸의 시간 창을 정한다
   period: 생성 주기(프레임). 플레이와 무관한 고정 박자. **반드시 낙하 시간보다 길게**
   lure  : 비조건 도형 비율
   switchEvery : 조건 전환까지 도형 수(±1 시드 지터)

   ★ 도형은 **고정된 주기**로 떨어진다(`period` 프레임). 플레이와 무관하다.
     메트로놈처럼 일정해야 "같은 색인가"만 판단하면 되기 때문이다.
     주기는 낙하 시간보다 길어서 화면에는 언제나 도형이 하나뿐이고,
     빨리 끊으면 그만큼 **다음 기준을 읽을 틈**이 생긴다 —
     빠른 플레이의 보상은 점수와 **여유**이지 템포가 아니다.

   ★ 구역이 곧 시간이다 (활성화 시점 기준). 20/20/20/40 으로 나눈 결과:
     레벨 0 — ×4 153ms / ×3 306ms / ×2 458ms / ×1 761ms, 그 뒤 바닥 = MISS
     레벨 5 — ×4 131ms / ×3 262ms / ×2 393ms / ×1 652ms

   ★★ switchEvery: 1 — 기준은 **매 도형마다** 바뀐다. 전환 정지도 배너도 없고,
     HUD 가 「지금 ▸ 다음」을 상시로 보여준다. 그래서 전환 비용이 0 이다.
     period 가 줄어드는 것(967 → 750ms)이 압박이다 — 다음 기준을 읽을 틈이 줄어든다.

   ★★ speed 를 거의 눕힌 것이 이 표의 핵심이다.
     사람의 색 판단은 대략 300ms 다. 그 선이 어디에 떨어지느냐가 전부다:
       ×2 = 알고 나서 친다 (안전)    ×3 = 아는 순간 바로 친다 (고민의 자리)
       ×4 = 알기 전에 지른다 (도박)  ×1 = 망설였다
     ×3 경계(306 → 262ms)를 인식 시간 언저리에 붙잡아 두는 것이 핵심이다.
     ×4 는 반응으로 닿지 않는다(153ms) — 선택해서 거는 도박 칸이다. README 4장.
     "칠까 말까"가 매 도형마다 살아 있어야 한다.
     난이도는 대신 **lure(유혹 비율 0.40 → 0.68)와 period(주기 967 → 750ms)** 에서 가져온다.
     주기가 줄면 다음 기준을 읽을 틈이 줄어든다 — 지각이 아니라 준비를 압박한다.
*/
const DIFFS = [
  //                       낙하    주기      틈(주기−낙하)
  { upTo:  12, speed: 12.0, period: 58, lure: 0.40, switchEvery: 1 },  // 806ms  967ms  161ms
  { upTo:  30, speed: 12.4, period: 55, lure: 0.46, switchEvery: 1 },  // 780    917    137
  { upTo:  55, speed: 12.8, period: 52, lure: 0.52, switchEvery: 1 },  // 755    867    112
  { upTo:  85, speed: 13.2, period: 50, lure: 0.58, switchEvery: 1 },  // 732    833    101
  { upTo: 125, speed: 13.6, period: 47, lure: 0.64, switchEvery: 1 },  // 711    783     72
  { upTo: Infinity, speed: 14.0, period: 45, lure: 0.68, switchEvery: 1 },  // 690  750  60
];

/* ★ 반드시 지킬 것: period ≥ 낙하 프레임((FLOOR−SPAWN_Y)/speed).
   깨지면 화면에 도형이 둘 생기고, 그 순간 위험-보상 축이 뒤집힌다(README 9장 2차).
   코드는 "도형이 없을 때만 생성"이라 큐가 생기지는 않지만 박자가 끊긴다. */
(function checkPeriod(){
  const fall = d => (FLOOR - SPAWN_Y) / d.speed;
  DIFFS.forEach((d, i) => {
    if (d.period < fall(d)) console.warn('[306ms] DIFFS[' + i + '] period ' + d.period +
      ' < 낙하 ' + fall(d).toFixed(1) + ' 프레임 — 박자가 끊긴다');
  });
})();

/* 개발용 난이도 덮어쓰기:  index.html?speed=12.6&lure=0.5&switch=5&period=55
   준 값으로 모든 레벨을 평평하게 만든다. 느낌을 빨리 재보기 위한 것이고,
   이 상태의 기록은 기본 난이도와 비교할 수 없다(화면 아래에 「튜닝됨」이 뜬다). */
let TUNED = null;
(function(){
  let q; try { q = new URLSearchParams(location.search); } catch(e){ return; }
  const num = k => q.has(k) && q.get(k) !== '' ? Number(q.get(k)) : null;
  const sp = num('speed'), lu = num('lure'), sw = num('switch'), bt = num('period');
  if (sp === null && lu === null && sw === null && bt === null && !q.get('score')) return;
  const parts = [];
  for (const d of DIFFS){
    if (sp !== null && isFinite(sp)) d.speed = sp;
    if (lu !== null && isFinite(lu)) d.lure = lu;
    if (sw !== null && isFinite(sw)) d.switchEvery = Math.max(2, Math.round(sw));
    if (bt !== null && isFinite(bt)) d.period = Math.max(1, Math.round(bt));
  }
  const sc = q.get('score');
  if (sc && SCORING[sc]){ SCORE_MODE = sc; parts.push('채점 ' + sc); }
  if (sp !== null) parts.push('speed ' + DIFFS[0].speed);
  if (lu !== null) parts.push('lure ' + DIFFS[0].lure);
  if (sw !== null) parts.push('전환 ' + DIFFS[0].switchEvery);
  if (bt !== null) parts.push('주기 ' + DIFFS[0].period);
  TUNED = parts.join(' · ');
})();
/* ---------- 색 4종 (+ 색맹 보조 기호) ---------- */
const COLORS = [
  { id:'blue',   hex:'#3B82F6', name:'파랑', glyph:'dot' },
  { id:'red',    hex:'#EF4444', name:'빨강', glyph:'tri' },
  { id:'yellow', hex:'#FACC15', name:'노랑', glyph:'sq'  },
  { id:'green',  hex:'#22C55E', name:'초록', glyph:'dia' },
];
const INK = 'rgba(8,12,24,.72)';

/* ---------- PRNG (게임 로직의 유일한 난수원) ---------- */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function zoneMult(y){ return y < Z4 ? 4 : y < Z3 ? 3 : y < Z2 ? 2 : 1; }

/* 배율 한 곳에서: 텍스트 색·크기, 구역 띠 색, 라벨 색, 소리 음높이, 화면 튐 */
const MULT = {
  4: { hex:'#FFD24A', size:40, band:'rgba(255,196,64,.105)', label:'rgba(255,206,84,.55)', freq:988, kick:3 },
  3: { hex:'#FFE9A8', size:30, band:'rgba(255,206,84,.055)', label:'rgba(255,219,150,.38)', freq:740, kick:1.5 },
  2: { hex:'#D8DEEA', size:24, band:'rgba(200,212,235,.040)', label:'rgba(200,212,235,.32)', freq:554, kick:0 },
  1: { hex:'#FFFFFF', size:19, band:'rgba(255,90,100,.055)', label:'rgba(255,150,155,.30)', freq:392, kick:0 },
};
function levelIdx(processed){
  for (let i = 0; i < DIFFS.length; i++) if (processed < DIFFS[i].upTo) return i;
  return DIFFS.length - 1;
}

/* =========================================================================
   시뮬레이션 — 순수하다. 렌더/오디오는 out 콜백으로만 나간다.
   같은 seed + 같은 틱에 들어온 같은 입력 => 같은 결과. (원칙 1)
   ========================================================================= */
function createSim(seed, out){
  const rng = mulberry32(seed >>> 0);
  const sim = {
    seed: seed >>> 0, rng, out: out || {},
    tick: 0, t: 0,
    phase: 'play',                 // play | over
    shapes: [], nextId: 1,
    nextSpawnT: 0, lastSpawnT: 0, periodMs: DIFFS[0].period * FRAME,
    sinceSwitch: 0, switchN: 0,
    cond: 0, nextCond: 0,
    freeze: 0, dying: false, frozen: null,
    score: 0, lives: LIVES, processed: 0,
    stats: { hit:0, wrong:0, miss:0, pass:0, z4:0, z3:0, z2:0, z1:0, bestHit:0 },
    inputs: [], pending: 0,
    over: false, lastFail: null,
  };
  sim.cond = Math.floor(rng() * 4);
  sim.nextCond = pickOther(sim, sim.cond);
  sim.switchN = rollSwitch(sim, 0);
  return sim;
}
function rollSwitch(sim, lvl){
  const n = DIFFS[lvl].switchEvery;
  const j = Math.floor(sim.rng() * 3) - 1;   // 시드 스트림을 일정하게 유지하려고 항상 뽑는다
  return n <= 2 ? n : Math.max(2, n + j);    // 1~2 면 지터 없이 그대로 (「항상 바뀜」)
}
function pickOther(sim, ci){
  const o = [0,1,2,3].filter(i => i !== ci);
  return o[Math.floor(sim.rng() * 3)];
}
function activeShape(sim){
  let best = null;
  for (const s of sim.shapes) if (s.y >= ACTIVE_MIN && (!best || s.y > best.y)) best = s;
  return best;
}
function simTap(sim){ if (!sim.over) sim.pending = Math.min(2, sim.pending + 1); }

function simStep(sim){
  if (sim.over) return;
  sim.tick++; sim.t = sim.tick * FRAME;

  /* 정지(WRONG / 마지막 MISS) 중에는 세계가 멈춘다. 입력은 버린다. */
  if (sim.freeze > 0){
    sim.freeze--; sim.pending = 0;
    if (sim.freeze === 0){
      sim.frozen = null;
      if (sim.dying) endSim(sim);
    }
    return;
  }

  /* 1. 입력 — 이동보다 먼저. 플레이어는 직전 프레임의 화면을 보고 눌렀다. */
  if (sim.pending > 0){
    sim.pending--;
    doTap(sim);
    if (sim.over || sim.freeze > 0) return;
  }

  /* 2. 이동 */
  for (const s of sim.shapes) s.y += s.speed;

  /* 3. 바닥 도달 */
  for (let i = sim.shapes.length - 1; i >= 0; i--){
    if (sim.shapes[i].y >= FLOOR){
      const s = sim.shapes.splice(i, 1)[0];
      resolveFloor(sim, s);
    }
  }
  if (sim.over || sim.freeze > 0) return;

  /* 4. 생성 — 고정 격자 위에서. 플레이와 무관하게 period 마다 한 개. */
  if (sim.phase === 'play' && sim.shapes.length === 0 && sim.t >= sim.nextSpawnT){
    const d = DIFFS[levelIdx(sim.processed)];
    let ci;
    if (sim.rng() < d.lure){
      const o = [0,1,2,3].filter(i => i !== sim.cond);
      ci = o[Math.floor(sim.rng() * 3)];
    } else ci = sim.cond;
    sim.shapes.push({ id: sim.nextId++, ci, y: SPAWN_Y, speed: d.speed });
    sim.lastSpawnT = sim.nextSpawnT;
    sim.periodMs = d.period * FRAME;
    do { sim.nextSpawnT += sim.periodMs; } while (sim.nextSpawnT <= sim.t);
  }
}

function doTap(sim){
  sim.inputs.push({ t: Math.round(sim.tick * FRAME * 100) / 100 });
  const a = activeShape(sim);
  if (!a){ if (sim.out.onEmpty) sim.out.onEmpty(); return; }

  const m = zoneMult(a.y);
  sim.shapes.splice(sim.shapes.indexOf(a), 1);
  sim.processed++;

  if (a.ci === sim.cond){
    const pts = SCORING[SCORE_MODE](a.y);
    sim.score += pts;
    sim.stats.hit++;
    sim.stats['z' + m]++;
    if (pts > sim.stats.bestHit) sim.stats.bestHit = pts;
    if (sim.out.onHit) sim.out.onHit(a, m, pts);
  } else {
    sim.stats.wrong++;
    sim.lives--;
    sim.lastFail = { ci: a.ci, y: a.y, kind: 'wrong' };
    /* 눌린 도형은 위에서 이미 빠졌다. 남은 것 중 조건 색이 있으면 = 위엣것을 노리다 아래를 눌렀다. */
    sim.frozen = { ci: a.ci, y: a.y, blocked: sim.shapes.some(x => x.ci === sim.cond) };
    sim.freeze = Math.round(WRONG_FREEZE / FRAME);
    sim.nextSpawnT += WRONG_FREEZE;      /* 정지한 만큼 박자도 뒤로 — 격자가 어긋나지 않게 */
    if (sim.lives <= 0) sim.dying = true;
    if (sim.out.onWrong) sim.out.onWrong(a);
  }
  afterResolve(sim);
}

function resolveFloor(sim, s){
  sim.processed++;
  if (s.ci === sim.cond){
    sim.stats.miss++;
    sim.lives--;
    sim.lastFail = { ci: s.ci, y: FLOOR, kind: 'miss' };
    if (sim.out.onMiss) sim.out.onMiss(s);
    if (sim.lives <= 0){ sim.dying = true; sim.freeze = Math.round(MISS_FREEZE / FRAME); }
    else sim.nextSpawnT = Math.max(sim.nextSpawnT, sim.t + 8 * FRAME);   /* MISS 뒤 최소 숨 */
  } else {
    sim.stats.pass++;
    if (sim.out.onPass) sim.out.onPass(s);
  }
  afterResolve(sim);
}

/* 도형 하나가 끝났다. **판정이 끝난 뒤에** 부른다 —
   먼저 밀면 방금 그 도형을 새 기준으로 재게 된다.
   기준은 큐처럼 한 칸 밀린다: 「다음」이 「지금」이 되고, 새 「다음」을 뽑는다.
   다음 도형은 새 기준 아래에서 생성된다. 화면에 도형이 없는 순간에만 밀리므로
   "판정 조건이 애매해지는 순간"은 존재하지 않는다. */
function afterResolve(sim){
  sim.sinceSwitch++;
  if (sim.sinceSwitch >= sim.switchN){
    sim.sinceSwitch = 0;
    sim.switchN = rollSwitch(sim, levelIdx(sim.processed));
    sim.cond = sim.nextCond;
    sim.nextCond = pickOther(sim, sim.cond);
    if (sim.out.onSwitch) sim.out.onSwitch(sim.cond);
  }
}

function endSim(sim){
  sim.over = true; sim.phase = 'over';
  if (sim.out.onOver) sim.out.onOver();
}

   ========================================================================= */
const Store = (function(){
  const mem = {};
  function pick(){
    try { if (window.storage && typeof window.storage.getItem === 'function') return window.storage; } catch(e){}
    try { localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return localStorage; } catch(e){}
    return { getItem:k=>(k in mem?mem[k]:null), setItem:(k,v)=>{mem[k]=String(v)}, removeItem:k=>{delete mem[k]} };
  }
  const s = pick();
  return {
    get(k){ try { return s.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { s.setItem(k, v); } catch(e){} },
  };
})();

async function lbSubmit(name, rec){
  if (TUNED) return { ok:false, reason:'튜닝된 판은 등록할 수 없습니다(기본 난이도와 비교 불가).' };

  name = (name || '익명').slice(0, 10);
  const body = { name, score: rec.score, seed: rec.seed, inputs: rec.inputs, at: Date.now() };
  if (LB.kind === 'db'){
    try {
      const ref = LB.db.doc('scores/' + nameId(name));
      const cur = await ref.get();                       // 이름당 최고 기록 하나 (문서 수가 안 늘어난다)
      if (cur.exists && (cur.data().score || 0) >= rec.score)
        return { ok:false, reason: '「' + name + '」의 기존 ' + fmt(cur.data().score) + '점이 더 높습니다.' };
      await ref.set(body);
      lbTop();
      return { ok:true };
    } catch(e){ return { ok:false, reason: lbMsg(e) }; }
  }
  /* Supabase 도 db 와 같게: 이름당 한 행, 더 높은 점수일 때만 덮어쓴다.
     id 가 기본키라 merge-duplicates 로 upsert 된다. 행이 무한히 쌓이지 않는다. */
  try {
    const id = nameId(name);
    const h = sbHead();
    const cur = await fetch(SB.url + '/rest/v1/' + SB.table + '?id=eq.' + id + '&select=score', { headers: h });
    if (cur.ok){
      const rows = await cur.json();
      if (rows[0] && (rows[0].score || 0) >= rec.score)
        return { ok:false, reason: '「' + name + '」의 기존 ' + fmt(rows[0].score) + '점이 더 높습니다.' };
    }
    const r = await fetch(SB.url + '/rest/v1/' + SB.table, {
      method:'POST',
      headers: Object.assign({}, h, { 'Content-Type':'application/json',
                                      Prefer:'return=minimal,resolution=merge-duplicates' }),
      body: JSON.stringify(Object.assign({ id }, body))
    });
    if (!r.ok) return { ok:false, reason: await sbErr(r) };
    lbTop();
    return { ok:true };
  } catch(e){ return { ok:false, reason:'네트워크 오류' }; }
}

function tone(freq, dur, type, vol, delay, freq2){
  if (!AC || muted) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);

  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.03);
}
function noiseBurst(dur, vol, cut, q){
  if (!AC || muted) return;
  const t0 = AC.currentTime;
  const n = Math.max(1, Math.floor(AC.sampleRate * dur));
  const buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cut; f.Q.value = q || 1;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t0);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start(t0);
}

const SCALE = [0, 3, 5, 7, 10];      // 마이너 펜타토닉(반음)

  if (!musicGain) return;

  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.03);
}

  if (!musicGain) return;
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'triangle'; o.frequency.setValueAtTime(freq, t);
  o.detune.setValueAtTime((Math.random() * 12 - 6), t);
  f.type = 'lowpass'; f.frequency.setValueAtTime(520, t);
  f.frequency.linearRampToValueAtTime(1500, t + dur * 0.6);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.05);

function mSaw(freq, t, dur, vol, cut){
  if (!musicGain) return;
  const o = AC.createOscillator(), g = AC.createGain(), f = AC.createBiquadFilter();
  o.type = 'sawtooth'; o.frequency.setValueAtTime(freq, t);
  f.type = 'lowpass'; f.frequency.setValueAtTime(cut, t);
  f.frequency.exponentialRampToValueAtTime(Math.max(200, cut * 0.35), t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(f); f.connect(g); g.connect(musicGain); o.start(t); o.stop(t + dur + 0.03);

   시작음을 올리고 감쇠를 절반으로 줄여 초저역 대신 어택이 들리게 한다. */
function mKick(t, vol){
  if (!musicGain) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(200, t);
  o.frequency.exponentialRampToValueAtTime(62, t + 0.045);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.115);
  o.connect(g); g.connect(musicGain); o.start(t); o.stop(t + 0.15);
}
let hatBuf = null;
function mHat(t, vol){
  if (!musicGain) return;
  if (!hatBuf){
    const n = Math.floor(AC.sampleRate * 0.08);
    hatBuf = AC.createBuffer(1, n, AC.sampleRate);
    const d = hatBuf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  }
  const src = AC.createBufferSource(); src.buffer = hatBuf;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6500;
  const g = AC.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(musicGain); src.start(t);
}

const HOOK = [0, 3, 6, 11];        // 훅이 놓이는 16분 자리
const MUSIC = [
  /* 걷는 베이스 + 네 음짜리 훅. 초저역에 몰리지 않게 전부 한 옥타브 위로 올렸다 */
  { name: '맥박', bpm: 100, step(i, t){
      const bar = (i >> 4) % 4, r = ROOTS[bar], k = i % 16;
      if (k === 0 || k === 6 || k === 10) mKick(t, k === 0 ? 0.30 : 0.19);
      if (k % 4 === 2) mHat(t, 0.055);
      /* 걷는 베이스: 1박 근음 · 2박 근음 · 3박 5도 · 4박 근음 */
      if (k % 4 === 0) mV(mHz(r + (k === 8 ? 7 : 0)), t, 0.27, 'triangle', 0.105);
      /* 네 음짜리 훅. 마디마다 한 음씩 밀려 같은 자리에서 반복되지 않는다 */
      const hi = HOOK.indexOf(k);
      if (hi >= 0) mV(mHz(r + 24 + SCALE[(hi + bar) % 5]), t, 0.24, 'triangle', 0.072);
  }},
  /* 타악기 없는 패드. 피로하지 않게 */
  { name: '물결', bpm: 64, step(i, t){
      const r = ROOTS[(i >> 4) % 4];
      if (i % 16 === 0){
        const bar = 60 / 64 / 4 * 16;
        mPad(mHz(r), t, bar * 1.15, 0.070);
        mPad(mHz(r + 7), t, bar * 1.15, 0.048);
        mPad(mHz(r + 12), t, bar * 1.15, 0.034);
      }
      if (i % 8 === 0) mV(mHz(r - 12), t, 1.3, 'sine', 0.055);                        // 낮은 맥
      if (i % 4 === 2) mV(mHz(r + 24 + SCALE[(i >> 2) % 5]), t, 0.75, 'sine', 0.024);  // 잔물결

  /* 16분 아르페지오. 몰아붙이는 쪽 */

      const r = ROOTS[(i >> 4) % 4];

/* 앞으로 0.25초치를 미리 예약한다(rAF 흔들림에도 박자가 안 흔들리게) */
function musicTick(){
  if (!AC || muted || musicSel < 0 || !musicGain) return;
  const tr = MUSIC[musicSel]; if (!tr) return;
  const sp = 60 / tr.bpm / 4;
  const now = AC.currentTime;

  }
}

/* 남의 기록은 신뢰할 수 없는 입력이다 — 언제나 textContent 로만 넣는다.
   대신 seed + 입력 로그가 함께 오므로 replay 로 검산할 수 있다(원칙 1). */
function verifyRow(r){
  if (TUNED) return null;                      // 튜닝된 화면에서는 검산이 무의미하다
  if (!r || !Array.isArray(r.inputs) || typeof r.score !== 'number') return null;
  try { return judgeReplay(r.seed, r.inputs).score === r.score; } catch(e){ return null; }
}
function renderBoard(){
  const list = document.getElementById('blist'), bmsg = document.getElementById('bmsg');
  if (!list) return;
  list.textContent = '';
  if (!boardRows || !boardRows.length){
    bmsg.textContent = boardMsg || (LB.kind === 'off'
      ? '리더보드가 설정되지 않았습니다. README 6장 참고.' : '아직 기록이 없습니다.');
    return;
  }
  let bad = 0;
  boardRows.forEach((r, i) => {
    const li = document.createElement('li');
    const mk = (cls, txt) => { const e = document.createElement('span'); e.className = cls; e.textContent = txt; return e; };
    li.appendChild(mk('rk', String(i + 1)));
    li.appendChild(mk('nm', String(r.name || '익명')));
    li.appendChild(mk('sc', fmt(Number(r.score) || 0)));
    const v = verifyRow(r);
    if (v === false) bad++;
    const vf = mk('vf', v === true ? '✓' : v === false ? '✕' : '·');
    vf.style.color = v === true ? '#7ee08a' : v === false ? '#ff8b8b' : '#68718c';
    li.appendChild(vf);
    list.appendChild(li);
  });
  bmsg.textContent = '기록마다 시드와 입력이 함께 저장된다. ✓ 는 재생 검산을 통과했다는 뜻'
    + (bad ? ' — ✕ ' + bad + '건은 재생과 점수가 다르다.' : '.');
}

/* =========================================================================
   화면 / 캔버스
   ========================================================================= */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const stage = document.getElementById('stage');
const uiEl = document.getElementById('ui');
const seedEl = document.getElementById('seed');
const msgEl = document.getElementById('msg');
const nmEl = document.getElementById('nm');
const boardEl = document.getElementById('board');

const RM = (function(){
  try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; }
})();

let scale = 1;
function layout(){
  const vw = window.innerWidth, vh = window.innerHeight;
  scale = Math.min(vw / W, vh / H);
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width  = Math.round(W * scale * dpr);
  cv.height = Math.round(H * scale * dpr);
  cv.style.width  = (W * scale) + 'px';
  cv.style.height = (H * scale) + 'px';
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
  stage.style.setProperty('--u', String(Math.max(.75, Math.min(2.2, scale))));
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 60));
layout();

/* =========================================================================
   연출(주스) — 게임 로직에 영향을 주지 않는다. 여기서만 Math.random 허용.
   ========================================================================= */
let parts = [], texts = [], squashes = [], heartFx = [];
let shake = 0, hudShake = 0, flash = null, goldFlash = 0, tintCi = -1, tintA = 0;
let hint = null, hintCount = 0;   // 규칙을 놓쳤을 때만, 한 세션에 3번까지
let condRoll = 0;                 // 1 → 0. HUD 에서 「다음」이 「지금」자리로 미끄러진다
/* 오른쪽 여백의 점수 기록. 최신이 맨 위, 과거는 한 칸씩 아래로 밀린다. */
let scoreLog = [];                // 최신이 앞 [{ pts, m }]
let logSlide = 0;                 // 1 → 0. 한 칸 미끄러져 내려오는 연출
const LOG_ROWS = 18, LOG_H = 22, LOG_X = (LANE_X1 + W) / 2;
function setHint(t, ms){ hint = { t, life: 1, decay: 16.7 / ms }; }

function burst(x, y, hex, n, spread){
  if (RM) return;
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, sp = (0.6 + Math.random() * 1.0) * (spread || 1);
    parts.push({ x, y, vx: Math.cos(a) * sp * 3.2, vy: Math.sin(a) * sp * 3.2 - 0.6,
                 r: 2 + Math.random() * 3.2, c: hex, life: 1, decay: 0.018 + Math.random() * 0.02 });
  }
  if (parts.length > 240) parts.splice(0, parts.length - 240);   // 상한
}
function popText(x, y, t, c, size){
  texts.push({ x, y: Math.max(HUD_H + 24, y), t, c, size, life: 1, decay: 0.026, vy: RM ? -0.2 : -1.5 });
}
function doShake(px){ if (!RM) shake = Math.max(shake, px); }
function doFlash(r, g, b, a, ms){ flash = { r, g, b, a, life: 1, decay: 16.7 / (ms || 120) }; }
function breakHeart(i){
  heartFx.push({ x: 13 + i * 18, y: 15, vx: (Math.random() - .5) * 1.6, vy: -1.2, rot: 0,
                 vr: (Math.random() - .5) * .25, life: 1 });
}
function updateFx(dtms){
  const k = Math.min(3, dtms / FRAME);
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.x += p.vx * k; p.y += p.vy * k; p.vy += 0.16 * k; p.vx *= 0.99;
    p.life -= p.decay * k;
    if (p.life <= 0) parts.splice(i, 1);
  }
  for (let i = texts.length - 1; i >= 0; i--){
    const t = texts[i];
    t.y += t.vy * k; t.vy *= 0.94; t.life -= t.decay * k;
    if (t.life <= 0) texts.splice(i, 1);
  }
  for (let i = squashes.length - 1; i >= 0; i--){
    squashes[i].life -= 0.03 * k;
    if (squashes[i].life <= 0) squashes.splice(i, 1);
  }
  for (let i = heartFx.length - 1; i >= 0; i--){
    const h = heartFx[i];
    h.x += h.vx * k; h.y += h.vy * k; h.vy += 0.22 * k; h.rot += h.vr * k; h.life -= 0.022 * k;
    if (h.life <= 0) heartFx.splice(i, 1);
  }
  if (shake > 0) shake = Math.max(0, shake - 0.5 * k);
  if (hudShake > 0) hudShake = Math.max(0, hudShake - 0.06 * k);
  if (goldFlash > 0) goldFlash = Math.max(0, goldFlash - 0.02 * k);
  if (flash){ flash.life -= flash.decay * k; if (flash.life <= 0) flash = null; }
  if (hint){ hint.life -= hint.decay * k; if (hint.life <= 0) hint = null; }
  if (condRoll > 0) condRoll = Math.max(0, condRoll - (16.7 / COND_ROLL) * k);
  if (logSlide > 0) logSlide = Math.max(0, logSlide - (16.7 / 170) * k);
  if (tintA > 0) tintA = Math.max(0, tintA - 0.006 * k);
}

/* =========================================================================
   앱 상태
   ========================================================================= */
let SCREEN = 'title';          // title | game | over
let G = null;                  // 현재 시뮬레이션
let MANUAL = false;            // __judge 훅이 시간을 직접 몰 때 rAF 스텝을 끈다
let bestShown = bestRec.score;
let beatFired = false;
let overAt = 0;
let replayCtl = null;          // 시각 재생 중일 때 { ticks, i }
let replayVerdict = null;      // { ok, score } — 재현 검증 결과
let lastResult = null;

const liveOut = {
  onHit(s, m, pts){
    const st = MULT[m];
    texts.length = 0;              /* 점수 표시는 언제나 하나만. 겹치면 못 읽는다 */
    burst(LANE_CX, s.y, COLORS[s.ci].hex, 10 + m * 3, 1 + m * .22);
    /* 연속 채점이어도 색·크기는 칸에서 가져온다 — 숫자는 정밀하게, 느낌은 또렷하게. */
    popText(LANE_CX, s.y - 10, SCORE_MODE === 'tier' ? '×' + m : '+' + pts, st.hex, st.size);
    scoreLog.unshift({ pts, m });
    if (scoreLog.length > LOG_ROWS) scoreLog.length = LOG_ROWS;
    logSlide = RM ? 0 : 1;
    sndHit(m);
    if (st.kick) doShake(st.kick);
    if (G.score > bestShown){
      bestShown = G.score;
      if (!beatFired && bestRec.score > 0){
        beatFired = true; goldFlash = 1; sndBest();
        popText(LANE_CX, 300, '최고 기록!', '#FFD75E', 26);
      }
    }
  },
  onWrong(s){
    doShake(6); doFlash(255, 60, 60, .34, 120);
    breakHeart(G.lives);
    sndWrong();
  },
  onMiss(s){
    squashes.push({ y: FLOOR, ci: s.ci, life: 1 });
    popText(LANE_CX, FLOOR - 44, '놓침', '#FF8B8B', 22);
    doShake(4); doFlash(255, 90, 90, .18, 90);
    breakHeart(G.lives);
    sndMiss();
  },
  onPass(s){
    burst(LANE_CX, FLOOR - 6, COLORS[s.ci].hex, 6, .45);
    sndPass();
  },
  onEmpty(){ hudShake = 1; sndEmpty(); },
  onSwitch(ci){ tintCi = ci; tintA = 0.06; condRoll = 1; sndRoll(); },
  onOver(){ finishGame(); },
};

function startGame(seed){
  const s = (seed === undefined || seed === null)
    ? (Math.floor(Math.random() * 0xFFFFFFFF) >>> 0) : (seed >>> 0);
  G = createSim(s, liveOut);
  SCREEN = 'game';
  bestShown = bestRec.score;
  beatFired = false;
  replayCtl = null; replayVerdict = null;
  parts.length = 0; texts.length = 0; squashes.length = 0; heartFx.length = 0;
  shake = 0; hudShake = 0; flash = null; goldFlash = 0; tintA = 0; hint = null; condRoll = 0;
  scoreLog.length = 0; logSlide = 0;
  uiEl.classList.remove('show');
  msgEl.textContent = '';
}

function finishGame(){
  SCREEN = 'over';
  overAt = performance.now();
  replayCtl = null;
  lastResult = {
    score: G.score, seed: G.seed, inputs: G.inputs.slice(),
    stats: Object.assign({}, G.stats), lastFail: G.lastFail,
  };
  if (G.score > bestRec.score){
    bestRec = { score: G.score, seed: G.seed, inputs: G.inputs.slice() };
    Store.set(BEST_KEY, JSON.stringify(bestRec));
  }
  bestShown = Math.max(bestShown, bestRec.score);
  seedEl.textContent = '시드 ' + lastResult.seed + ' · 입력 ' + lastResult.inputs.length + '회';
  if (!nmEl.value) nmEl.value = Store.get('judge:name') || '';
  uiEl.classList.add('show');
}

/* =========================================================================
   입력
   ========================================================================= */
function onTap(){
  if (boardEl.classList.contains('show')) return;   // 순위표가 열려 있으면 게임 탭을 막는다
  audioInit();
  if (SCREEN === 'title'){ startGame(); return; }
  if (SCREEN === 'over'){
    if (performance.now() - overAt > RESTART_LOCK) startGame();
    return;
  }
  if (replayCtl){ startGame(); return; }   // 재생 중 탭 = 새 판
  simTap(G);
}
let lastTouch = -1e9;   // 로드 직후 첫 클릭이 터치 중복 방지에 먹히지 않도록
function canvasXY(e){
  const r = cv.getBoundingClientRect();
  const t = e.touches && e.touches[0] ? e.touches[0] : e;
  return { x: (t.clientX - r.left) / r.width * W, y: (t.clientY - r.top) / r.height * H };
}
document.addEventListener('touchstart', e => {
  if (uiEl.contains(e.target) || boardEl.contains(e.target)) return;
  e.preventDefault(); lastTouch = performance.now();
  const p = canvasXY(e);
  if (hitMusicBar(p.x, p.y)) return;
  onTap();
}, { passive:false });
document.addEventListener('mousedown', e => {
  if (uiEl.contains(e.target) || boardEl.contains(e.target)) return;
  if (performance.now() - lastTouch < 700) return;
  const p = canvasXY(e);
  if (hitMusicBar(p.x, p.y)) return;
  onTap();
});
window.addEventListener('keydown', e => {
  if (e.target && (e.target.tagName === 'INPUT')) return;
  if (e.key === 'm' || e.key === 'M'){ audioInit(); muted = !muted; saveAudioPrefs(); return; }
  if (e.code === 'Space' || e.code === 'Enter' || e.key === ' ' || e.key === 'Enter'){
    e.preventDefault(); onTap();
  }
});

document.getElementById('btnReplay').addEventListener('click', () => {

/* 시각 재생: 같은 시드로 새 판을 만들고 기록된 틱에 자동으로 탭한다. */
function startReplayVisual(seed, inputs){
  startGame(seed);
  replayCtl = { ticks: inputs.map(i => Math.round(i.t / FRAME)), i: 0 };
}

/* =========================================================================
   메인 루프 — 고정 타임스텝(1틱 = 1프레임). 재현성을 위해 dt 를 이산화한다.
   rAF 간격이 얼마든 시뮬레이션은 항상 같은 틱 열을 밟는다.
   렌더는 남은 시간(alpha)으로 보간해서 고주사율에서도 부드럽다.
   ========================================================================= */
let acc = 0, lastT = performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dtms = Math.min(100, now - lastT);
  lastT = now;

  if (!MANUAL && SCREEN === 'game' && G && !G.over){
    acc += dtms;
    let steps = 0;
    while (acc >= FRAME && steps < 3){          // dt 클램프 [0,3]
      if (replayCtl){
        while (replayCtl.i < replayCtl.ticks.length && replayCtl.ticks[replayCtl.i] <= G.tick + 1){
          simTap(G); replayCtl.i++;
        }
      }
      simStep(G);
      acc -= FRAME; steps++;
    }
    if (acc > FRAME * 3) acc = 0;
  }
  musicTick();
  updateFx(dtms);
  draw((MANUAL || !G || G.over || G.freeze > 0) ? 0 : Math.min(1, acc / FRAME));
}
requestAnimationFrame(frame);
lbInit();      // 아티팩트 db 는 늦게 붙는다. 붙으면 HUD 의 「세계 1위」가 채워진다

/* =========================================================================
   그리기
   ========================================================================= */
function fmt(n){ return n.toLocaleString('ko-KR'); }

function glyph(kind, x, y, r){
  ctx.beginPath();
  if (kind === 'dot'){ ctx.arc(x, y, r * .72, 0, 6.2832); }
  else if (kind === 'tri'){ ctx.moveTo(x, y - r); ctx.lineTo(x + r * .92, y + r * .72); ctx.lineTo(x - r * .92, y + r * .72); ctx.closePath(); }
  else if (kind === 'sq'){ ctx.rect(x - r * .78, y - r * .78, r * 1.56, r * 1.56); }
  else { ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); }
  ctx.fill();
}
function heartPath(x, y, s){
  ctx.beginPath();
  ctx.moveTo(x, y + s * .78);
  ctx.bezierCurveTo(x - s * 1.5, y - s * .35, x - s * .55, y - s * 1.15, x, y - s * .35);
  ctx.bezierCurveTo(x + s * .55, y - s * 1.15, x + s * 1.5, y - s * .35, x, y + s * .78);
  ctx.closePath();
}
function chip(ci, x, y, r){
  const c = COLORS[ci];
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832);
  ctx.fillStyle = c.hex; ctx.fill();
  ctx.fillStyle = INK; glyph(c.glyph, x, y, r * .42);
}

function drawShape(ci, y, active, alpha, sc){
  const c = COLORS[ci];
  const r = R * (sc || 1);
  ctx.save();
  ctx.globalAlpha = alpha;
  if (active && !RM){ ctx.shadowColor = c.hex; ctx.shadowBlur = 20; }
  ctx.beginPath(); ctx.arc(LANE_CX, y, r, 0, 6.2832);
  ctx.fillStyle = c.hex; ctx.fill();
  ctx.shadowBlur = 0;
  ctx.lineWidth = active ? 3 : 2;
  ctx.strokeStyle = active ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.16)';
  ctx.stroke();
  ctx.fillStyle = INK; glyph(c.glyph, LANE_CX, y, r * .42);
  ctx.restore();
}

function drawLane(bare){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0d1220'); g.addColorStop(1, '#080b14');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,.022)';
  ctx.fillRect(LANE_X0, 0, LANE_X1 - LANE_X0, FLOOR);

  if (tintA > 0 && tintCi >= 0){
    ctx.globalAlpha = tintA;
    ctx.fillStyle = COLORS[tintCi].hex;
    ctx.fillRect(LANE_X0, 0, LANE_X1 - LANE_X0, FLOOR);
    ctx.globalAlpha = 1;
  }

  if (bare){
    ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(0, FLOOR + 3, W, H - FLOOR - 3);
    return;
  }
  const bands = [
    { y0: HUD_H, y1: Z4, m: 4 },
    { y0: Z4,    y1: Z3, m: 3 },
    { y0: Z3,    y1: Z2, m: 2 },
    { y0: Z2,  y1: FLOOR, m: 1 },
  ].map(b => ({ ...b, c: MULT[b.m].band, lc: MULT[b.m].label,
      /* 칸 채점이면 배율, 연속 채점이면 그 띠에서 받을 수 있는 최고 점수 */
      l: SCORE_MODE === 'tier' ? '×' + b.m
                               : String(SCORING[SCORE_MODE](Math.max(b.y0, ACTIVE_MIN))) }));
  for (const b of bands){
    ctx.fillStyle = b.c; ctx.fillRect(LANE_X0, b.y0, LANE_X1 - LANE_X0, b.y1 - b.y0);
    ctx.fillStyle = b.lc; ctx.font = '700 15px system-ui, sans-serif';
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    /* 왼쪽에만. 오른쪽 여백은 점수 기록(drawLog)이 쓴다. */
    ctx.fillText(b.l, LANE_X0 + 8, b.y0 + 16);
  }
  ctx.save();
  ctx.setLineDash([5, 6]); ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,.10)';
  [Z4, Z3, Z2].forEach(y => { ctx.beginPath(); ctx.moveTo(LANE_X0, y); ctx.lineTo(LANE_X1, y); ctx.stroke(); });
  ctx.restore();

  ctx.fillStyle = 'rgba(255,255,255,.30)'; ctx.fillRect(LANE_X0 - 6, FLOOR, (LANE_X1 - LANE_X0) + 12, 3);
  ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(0, FLOOR + 3, W, H - FLOOR - 3);
}

function drawHud(){
  const off = hudShake > 0 ? Math.sin(hudShake * 40) * 3 * hudShake : 0;
  ctx.save();
  ctx.fillStyle = 'rgba(8,10,18,.90)'; ctx.fillRect(0, 0, W, HUD_H);
  ctx.fillStyle = 'rgba(255,255,255,.09)'; ctx.fillRect(0, HUD_H - 1, W, 1);

  /* 목숨 */
  const lives = G ? G.lives : LIVES;
  for (let i = 0; i < LIVES; i++){
    heartPath(13 + i * 18, 15, 7);
    if (i < lives){ ctx.fillStyle = '#FF5C6C'; ctx.fill(); }
    else { ctx.strokeStyle = 'rgba(255,92,108,.30)'; ctx.lineWidth = 1.5; ctx.stroke(); }
  }
  for (const h of heartFx){
    ctx.save(); ctx.globalAlpha = h.life; ctx.translate(h.x, h.y); ctx.rotate(h.rot);
    heartPath(0, 0, 7); ctx.fillStyle = '#FF5C6C'; ctx.fill(); ctx.restore();
  }

  /* 기준: 「지금 ▸ 다음」. 기준은 매 도형마다 밀리므로 팝업 대신 여기서 상시로 보인다. */
  if (G){
    const cur = COLORS[G.cond];
    const CR = 12, NR = 9, cy = 20;
    ctx.font = '700 17px system-ui, sans-serif';
    const tw = ctx.measureText(cur.name).width;
    const total = CR * 2 + 6 + tw + 13 + 9 + 11 + NR * 2;
    /* 하트(왼쪽)와 점수(오른쪽) 사이 공간의 한가운데 */
    const x0 = 190 - total / 2 + off;
    const curX  = x0 + CR;
    const nameX = x0 + CR * 2 + 6;
    const chevX = nameX + tw + 13 + 4;
    const nextX = chevX + 4 + 11 + NR;

    /* 롤: 「다음」자리에서 「지금」자리로 미끄러지며 커진다 */
    const e = 1 - condRoll * condRoll;               // 0 → 1 (ease-out)
    ctx.save();
    if (!RM && condRoll > 0){
      chip(G.cond, nextX + (curX - nextX) * e, cy, NR + (CR - NR) * e);
    } else {
      chip(G.cond, curX, cy, CR);
    }
    ctx.globalAlpha = RM ? 1 : e;
    ctx.fillStyle = '#EAEFF9'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(cur.name, nameX, cy + 1);

    /* 다음 */
    ctx.globalAlpha = RM ? 1 : e;
    ctx.font = '700 16px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(180,192,215,.55)';
    ctx.textAlign = 'center';
    ctx.fillText('›', chevX, cy);
    ctx.globalAlpha = (RM ? 1 : e) * 0.8;   /* 미리 읽어야 하는 정보다. 너무 흐리면 안 된다 */
    chip(G.nextCond, nextX, cy, NR);
    ctx.globalAlpha = (RM ? 1 : e) * 0.8;
    ctx.font = '700 8.5px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(180,192,215,.85)';
    ctx.fillText('다음', nextX, cy + 17);
    ctx.restore();
  }

  /* 점수 / 최고 */
  const sc = G ? G.score : 0;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.font = '800 19px system-ui, sans-serif';
  ctx.fillStyle = goldFlash > 0 ? '#FFD75E' : '#FFFFFF';
  ctx.fillText(fmt(sc), W - 12, 16);
  ctx.font = '600 10px system-ui, sans-serif';
  ctx.fillStyle = goldFlash > 0 ? 'rgba(255,215,94,.95)' : 'rgba(190,200,220,.62)';
  ctx.fillText('최고 ' + fmt(Math.max(bestShown, sc)), W - 12, 34);

  if (worldTop){
    ctx.textAlign = 'left';
    ctx.font = '600 10px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(190,200,220,.52)';
    ctx.fillText('세계 1위 ' + fmt(worldTop.score), 12, 34);
  }
  ctx.restore();
}

function chevron(x, y, sz, dir){
  ctx.beginPath();
  ctx.moveTo(x, y - sz * .78); ctx.lineTo(x + sz * dir, y); ctx.lineTo(x, y + sz * .78);
  ctx.closePath(); ctx.fill();
}
/* "탭은 이 도형에 들어간다" 를 말이 아니라 그림으로. */
function drawTarget(y){
  const pulse = RM ? 0.5 : (Math.sin(performance.now() / 260) + 1) * 0.5;
  const off = 44 + pulse * 4;
  ctx.save();
  ctx.globalAlpha = .18;
  ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(LANE_X0 + 3, y); ctx.lineTo(LANE_X1 - 3, y); ctx.stroke();
  ctx.globalAlpha = .55 + pulse * .45;
  ctx.fillStyle = '#FFFFFF';
  chevron(LANE_CX - off, y, 11, 1);
  chevron(LANE_CX + off, y, 11, -1);
  ctx.restore();
}
/* 바닥선 아래 여백 — 상시 안내, 규칙을 놓쳤을 때는 그 자리에 힌트 */
function drawGround(){
  if (SCREEN !== 'game' || replayCtl) return;
  ctx.save();

  /* 고정 박자를 눈에 보이게. 판정 구역이 아니라 바닥선 아래에 둔다 —
     여기 있는 것은 "언제 다음이 오나"이지 "언제까지 쳐야 하나"가 아니다. */
  if (G && !G.over && G.periodMs > 0){
    const w = LANE_X1 - LANE_X0, y = FLOOR + 7;
    const k = Math.max(0, Math.min(1, (G.t - G.lastSpawnT) / G.periodMs));
    ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(LANE_X0, y, w, 2);
    ctx.fillStyle = k > .88 ? 'rgba(255,215,94,.55)' : 'rgba(255,255,255,.22)';
    ctx.fillRect(LANE_X0, y, w * k, 2);
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (hint){
    ctx.globalAlpha = Math.min(1, hint.life * 2.4);
    ctx.font = '700 12px system-ui, sans-serif';
    ctx.fillStyle = '#FFC978';
    ctx.fillText(hint.t, LANE_CX, FLOOR - 14);
  } else if (TUNED){
    ctx.globalAlpha = .5;
    ctx.font = '600 11px system-ui, sans-serif';
    ctx.fillStyle = '#7FD1E0';
    ctx.fillText('튜닝됨 · ' + TUNED, LANE_CX, FLOOR - 14);
  }
  ctx.restore();
}

function drawFx(){
  for (const s of squashes){
    const a = s.life;
    ctx.save(); ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.ellipse(LANE_CX, FLOOR - 8 * a, R * (1.35 - .2 * a), R * (0.34 + .2 * a), 0, 0, 6.2832);
    ctx.fillStyle = COLORS[s.ci].hex; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(LANE_CX - 10, FLOOR - 14); ctx.lineTo(LANE_CX + 4, FLOOR - 2); ctx.stroke();
    ctx.restore();
  }
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const t of texts){
    ctx.globalAlpha = Math.max(0, Math.min(1, t.life * 1.6));
    ctx.font = '800 ' + t.size + 'px system-ui, sans-serif';
    ctx.fillStyle = t.c;
    ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 4;
    ctx.strokeText(t.t, t.x, t.y); ctx.fillText(t.t, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

/* 오른쪽 여백: 방금 얻은 점수가 맨 위에 얹히고 과거는 한 칸씩 내려간다.
   레인(58~302) 밖이라 판정 화면에는 절대 겹치지 않는다. */
function drawLog(){
  if (SCREEN !== 'game' || !scoreLog.length) return;
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const top = HUD_H + 18;
  for (let i = scoreLog.length - 1; i >= 0; i--){
    const y = top + (i + logSlide) * LOG_H;
    if (y > FLOOR - 6) continue;
    let a = Math.max(0, 1 - i * 0.085);
    if (i === 0 && logSlide > 0) a *= 1 - logSlide * 0.65;   // 갓 들어온 것은 나타나면서
    ctx.globalAlpha = a;
    ctx.font = (i === 0 ? '800 15px' : '700 13px') + ' system-ui, sans-serif';
    ctx.fillStyle = MULT[scoreLog[i].m].hex;
    ctx.fillText('+' + scoreLog[i].pts, LOG_X, y);
  }
  ctx.restore();
}

/* ---- 음악 컨트롤: 바닥선 아래 한 줄. 레인 밖이라 플레이를 가리지 않는다 ---- */
const MBTN = [
  { k: 0,  label: '맥박', x0: 24,  x1: 84  },
  { k: 1,  label: '물결', x0: 88,  x1: 148 },
  { k: 2,  label: '톱니', x0: 152, x1: 212 },
  { k: -1, label: '끔',   x0: 216, x1: 258 },
  { k: 'mute',            x0: 292, x1: 340 },
];
const MBAR_Y = FLOOR + 25;

function drawSpeaker(x, y, off){
  ctx.beginPath();
  ctx.moveTo(x - 7, y - 3); ctx.lineTo(x - 3.5, y - 3); ctx.lineTo(x + 0.5, y - 7);
  ctx.lineTo(x + 0.5, y + 7); ctx.lineTo(x - 3.5, y + 3); ctx.lineTo(x - 7, y + 3);
  ctx.closePath();
  ctx.fillStyle = off ? '#FF8B8B' : '#C8D4EB'; ctx.fill();
  ctx.strokeStyle = off ? '#FF8B8B' : '#C8D4EB'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  if (off){ ctx.moveTo(x + 4, y - 4.5); ctx.lineTo(x + 10, y + 4.5);
            ctx.moveTo(x + 10, y - 4.5); ctx.lineTo(x + 4, y + 4.5); }
  else { ctx.arc(x + 2, y, 5, -0.85, 0.85); ctx.moveTo(x + 10.5, y - 5.5); ctx.arc(x + 2, y, 8.5, -0.75, 0.75); }
  ctx.stroke();
}

function drawMusicBar(){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 11.5px system-ui, sans-serif';
  for (const b of MBTN){
    const cx = (b.x0 + b.x1) / 2;
    if (b.k === 'mute'){
      ctx.globalAlpha = muted ? .9 : .4;
      drawSpeaker(cx, MBAR_Y, muted);
      continue;
    }
    const on = !muted && musicSel === b.k;
    ctx.globalAlpha = on ? 1 : .32;
    if (on){
      ctx.beginPath();
      ctx.roundRect(b.x0, MBAR_Y - 9.5, b.x1 - b.x0, 19, 9.5);
      ctx.fillStyle = 'rgba(255,215,94,.15)'; ctx.fill();
    }
    ctx.fillStyle = on ? '#FFD75E' : '#8C97AE';
    ctx.fillText(b.label, cx, MBAR_Y + 0.5);
  }
  ctx.restore();
}

/* 캔버스 논리 좌표에서 컨트롤 바를 눌렀나 */
function hitMusicBar(x, y){
  if (y < MBAR_Y - 15 || y > MBAR_Y + 15) return false;
  for (const b of MBTN){
    if (x < b.x0 - 6 || x > b.x1 + 6) continue;
    audioInit();
    if (b.k === 'mute') muted = !muted;
    else { musicSel = b.k; muted = false; mStep = 0; mNextT = 0; }
    saveAudioPrefs();
    return true;
  }
  return false;
}

function drawFreeze(){
  const f = G.frozen; if (!f) return;
  ctx.save();
  ctx.fillStyle = 'rgba(4,6,12,.42)'; ctx.fillRect(0, 0, W, H);
  drawShape(f.ci, f.y, false, 1, RM ? 1 : 1.6);
  ctx.beginPath(); ctx.arc(LANE_CX, f.y, R * (RM ? 1 : 1.6) + 5, 0, 6.2832);
  ctx.strokeStyle = '#FF3B4E'; ctx.lineWidth = 4; ctx.stroke();
  const ty = f.y > 430 ? f.y - 82 : f.y + 82;
  ctx.font = '800 22px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#FF6B7A';
  ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 5;
  const msg = '✕ 이건 ' + COLORS[f.ci].name;
  ctx.strokeText(msg, LANE_CX, ty); ctx.fillText(msg, LANE_CX, ty);
  ctx.restore();
}

function drawTitle(){
  ctx.save();
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '900 68px system-ui, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText('306ms', LANE_CX, 192);
  /* 이름이 곧 설계 상수다 — 15점 눈금이 사람의 인식 시간 위에 놓여 있다 (README 8장) */
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,201,120,.55)';
  ctx.fillText('사람이 색을 알아보는 데 걸리는 시간', LANE_CX, 234);
  ctx.font = '600 15px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(200,212,235,.80)';
  ctx.fillText('조건 색만 탭 · 빨리 칠수록 큰 점수', LANE_CX, 262);
  for (let i = 0; i < 4; i++) chip(i, LANE_CX - 75 + i * 50, 320, 19);
  ctx.font = '600 12.5px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(160,175,205,.62)';
  ctx.fillText('위 기준과 같은 색이면 누르고, 아니면 보낸다.', LANE_CX, 366);
  ctx.fillText('기준은 매번 바뀐다 — 다음 기준이 오른쪽에 미리 보인다.', LANE_CX, 387);
  ctx.font = '700 13.5px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,201,120,.92)';
  ctx.fillText('빨리 누를수록 위에서 잡힌다 = 점수가 크다', LANE_CX, 420);
  ctx.font = '600 12px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(160,175,205,.55)';
  ctx.fillText('도형은 일정한 박자로 온다. 빨리 끊을수록 다음을 볼 틈이 는다.', LANE_CX, 441);
  const bl = 0.55 + 0.45 * Math.sin(performance.now() / 380);
  ctx.globalAlpha = RM ? 1 : bl;
  ctx.font = '800 22px system-ui, sans-serif';
  ctx.fillStyle = '#FFD75E';
  ctx.fillText('탭해서 시작', LANE_CX, 492);
  ctx.globalAlpha = 1;
  if (bestRec.score > 0){
    ctx.font = '600 13px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(190,200,220,.62)';
    ctx.fillText('최고 ' + fmt(bestRec.score), LANE_CX, 530);
  }
  ctx.restore();
}

function drawOver(){
  const r = lastResult; if (!r) return;
  ctx.save();
  ctx.fillStyle = 'rgba(6,8,14,.86)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,40,60,.07)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

  ctx.font = '800 20px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(200,212,235,.72)';
  ctx.fillText('게임 오버', LANE_CX, 128);

  ctx.font = '900 58px system-ui, sans-serif';
  ctx.fillStyle = '#FFFFFF';
  ctx.fillText(fmt(r.score), LANE_CX, 188);

  const isBest = r.score >= bestRec.score && r.score > 0;
  ctx.font = '700 13px system-ui, sans-serif';
  ctx.fillStyle = isBest ? '#FFD75E' : 'rgba(190,200,220,.62)';
  ctx.fillText((isBest ? '최고 기록! · ' : '') + '최고 ' + fmt(bestRec.score), LANE_CX, 228);

  const s = r.stats;
  ctx.font = '700 14.5px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(215,225,245,.88)';
  ctx.fillText('맞춤 ' + s.hit + '    오답 ' + s.wrong + '    놓침 ' + s.miss, LANE_CX, 280);
  ctx.font = '700 14.5px system-ui, sans-serif';
  if (SCORE_MODE === 'tier'){
    [4, 3, 2, 1].forEach((m, i) => {
      ctx.fillStyle = MULT[m].hex;
      ctx.globalAlpha = m === 1 ? .72 : .95;
      ctx.fillText('×' + m + '  ' + s['z' + m], LANE_CX - 76 + i * 51, 312);
    });
    ctx.globalAlpha = 1;
  } else {
    const avg = s.hit ? (r.score / s.hit) : 0;
    ctx.fillStyle = MULT[3].hex;
    ctx.fillText('한 방 평균 +' + avg.toFixed(1), LANE_CX - 62, 312);
    ctx.fillStyle = MULT[4].hex;
    ctx.fillText('최고 +' + s.bestHit, LANE_CX + 68, 312);
  }

  /* 마지막에 죽은 도형 — 붉게 남는다 */
  if (r.lastFail){
    ctx.save();
    ctx.globalAlpha = .55;
    drawShape(r.lastFail.ci, 386, false, 1, 1);
    ctx.globalAlpha = 1;
    ctx.beginPath(); ctx.arc(LANE_CX, 386, R + 5, 0, 6.2832);
    ctx.strokeStyle = 'rgba(255,59,78,.85)'; ctx.lineWidth = 3; ctx.stroke();
    ctx.font = '600 11.5px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,120,132,.85)';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(r.lastFail.kind === 'wrong'
      ? '마지막: ' + COLORS[r.lastFail.ci].name + '을 눌렀다'
      : '마지막: ' + COLORS[r.lastFail.ci].name + '을 놓쳤다', LANE_CX, 428);
    ctx.restore();
  }

  if (performance.now() - overAt > RESTART_LOCK){
    const bl = 0.55 + 0.45 * Math.sin(performance.now() / 380);
    ctx.globalAlpha = RM ? 1 : bl;
    ctx.font = '800 20px system-ui, sans-serif';
    ctx.fillStyle = '#FFD75E';
    ctx.textAlign = 'center';
    ctx.fillText('탭해서 다시', LANE_CX, 480);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function draw(alpha){
  ctx.save();
  if (shake > 0){
    ctx.translate((Math.random() - .5) * shake * 2, (Math.random() - .5) * shake * 2);
  }
  drawLane(SCREEN === 'title');

  if (G && SCREEN === 'game'){
    const act = activeShape(G);
    const frozen = G.freeze > 0;
    if (act) drawTarget(act.y + (frozen ? 0 : act.speed * alpha));
    for (const s of G.shapes){
      const y = s.y + (frozen ? 0 : s.speed * alpha);
      const on = !!(act && s.id === act.id);
      drawShape(s.ci, y, on, on ? 1 : 0.44, on ? 1 : 0.78);   // 대기 중이면 작고 어둡게
    }
  }
  drawFx();
  drawLog();
  if (SCREEN !== 'title') drawHud();

  if (G && G.freeze > 0 && G.frozen) drawFreeze();
  drawGround();

  if (goldFlash > 0){
    ctx.fillStyle = 'rgba(255,215,94,' + (goldFlash * .18) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (flash){
    ctx.fillStyle = 'rgba(' + flash.r + ',' + flash.g + ',' + flash.b + ',' + (flash.a * flash.life) + ')';
    ctx.fillRect(0, 0, W, H);
  }
  if (SCREEN === 'title') drawTitle();
  if (SCREEN === 'over') drawOver();
  drawMusicBar();          /* 어느 화면에서도 손이 닿게 맨 위에 */

  if (replayCtl && SCREEN === 'game'){
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '700 12px system-ui, sans-serif';
    if (replayVerdict){
      ctx.fillStyle = replayVerdict.ok ? 'rgba(126,224,138,.95)' : 'rgba(255,139,139,.95)';
      ctx.fillText((replayVerdict.ok ? '재현 일치 · ' : '재현 불일치! · ') + fmt(replayVerdict.score) + '점',
                   LANE_CX, FLOOR + 16);
    }
    ctx.fillStyle = 'rgba(255,215,94,.75)';
    ctx.fillText('재생 중 · 시드 ' + G.seed + ' · 탭하면 새 판', LANE_CX, FLOOR + 32);
  }
  ctx.restore();
}

/* =========================================================================
   재현 검증 — 렌더 없이 같은 시드/입력으로 다시 돌린다. (5장)
   ========================================================================= */
function judgeReplay(seed, inputs){
  const sim = createSim(seed, {});
  const ticks = inputs.map(i => Math.round(i.t / FRAME));
  const last = ticks.length ? ticks[ticks.length - 1] : 0;
  const maxTick = last + 60 * 60 * 3;
  let k = 0;
  while (!sim.over && sim.tick < maxTick){
    while (k < ticks.length && ticks[k] <= sim.tick + 1){ simTap(sim); k++; }
    simStep(sim);
  }
  return {
    score: sim.score, lives: sim.lives, processed: sim.processed,
    stats: Object.assign({}, sim.stats), timeMs: Math.round(sim.t), over: sim.over,
  };
}

/* =========================================================================
   자동 플레이 테스트 훅
   ========================================================================= */
window.__judge = {
  DIFFS,
  reset(seed){
    MANUAL = true;
    startGame(seed === undefined ? 1 : seed);
    return this.state();
  },
  step(dtFrames){
    const n = Math.max(1, Math.round(dtFrames === undefined ? 1 : dtFrames));
    for (let i = 0; i < n && G && !G.over; i++) simStep(G);
    if (G && G.over && SCREEN === 'game') finishGame();
    return this.state();
  },
  tap(){ if (G) simTap(G); },
  state(){
    if (!G) return null;
    const a = activeShape(G);
    return {
      score: G.score, lives: G.lives, level: levelIdx(G.processed),
      active: a ? { id: a.id, color: COLORS[a.ci].id, y: a.y, mult: zoneMult(a.y) } : null,
      condition: COLORS[G.cond].id,
      nextCondition: COLORS[G.nextCond].id,
      over: G.over,
      /* 봇 편의용 추가 필드(요청서 목록 밖) */
      phase: G.phase, timeMs: G.tick * FRAME, tick: G.tick,
      processed: G.processed, stats: Object.assign({}, G.stats),
      seed: G.seed, frozen: G.freeze > 0,
    };
  },
  replay(seed, inputs){ return judgeReplay(seed, inputs); },
  lastResult(){ return lastResult; },
  scoreMode(m){ if (m && SCORING[m]) SCORE_MODE = m; return SCORE_MODE; },
  manual(on){ MANUAL = !!on; },
};
